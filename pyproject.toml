[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "civ6-planner"
version = "0.1.0"
description = "Plan Civ VI city and district placement from the revealed map"
requires-python = ">=3.11"   # tomllib
license = { text = "MIT" }
dependencies = [
    "scipy>=1.11",
]

[project.scripts]
civ6-planner = "civ6_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

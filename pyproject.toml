[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "civ6-planner"
version = "0.1.0"
description = "Plan Civ VI city and district placement from the revealed map"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
civ6-planner = "civ6_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

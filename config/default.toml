# Default planner settings. Run with another file via `--config FILE`: it only needs the
# values it changes; everything else comes from here.

[problem]
n_cities = "max"                   # new cities to found: a number, or "max" (as many as fit)
districts = [                      # districts per city (game type names)
    "DISTRICT_CAMPUS",
    "DISTRICT_INDUSTRIAL_ZONE",
    "DISTRICT_COMMERCIAL_HUB",
    "DISTRICT_HOLY_SITE",
    "DISTRICT_THEATER",
    "DISTRICT_ENCAMPMENT",
    "DISTRICT_HARBOR",             # coast tiles only; cities without one simply get none
    "DISTRICT_AQUEDUCT",           # next to the city centre and fresh water (river, lake, mountain, oasis)
    "DISTRICT_DAM",                # floodplains with a river on 2+ edges; one per river
]
max_city_candidates = 400          # keep only the best city sites by site value
max_specialty_districts = 3        # per city: districts with RequiresPopulation (all planned ones
                                   # but Aqueduct and Dam); the game allows 1 + (population - 1) // 3
improvements = [                   # tile improvements to plan (game type names)
    "IMPROVEMENT_FARM",
    "IMPROVEMENT_MINE",
    "IMPROVEMENT_QUARRY",
    "IMPROVEMENT_PLANTATION",
    "IMPROVEMENT_CAMP",
    "IMPROVEMENT_PASTURE",
    "IMPROVEMENT_FISHING_BOATS",
    "IMPROVEMENT_LUMBER_MILL",
]
max_improvements = 5               # per city (existing improvements of a city count)
improvement_candidates = 6         # per city, only its best (improvement, tile) options by value
                                   # are considered: keeps the full maps fast

[objective]
site_radius = 2                    # tiles counted in a city's site value
loss_factor = 0.5                  # share of a covered tile's yields counted as lost
city_bonus = 100.0                 # per city: found the cities whenever possible
district_bonus = 10.0              # per district: build them whenever possible
worked_tile_factor = 1.0           # an improved tile is worked: its own yields count this much on
                                   # top of the improvement's gain (0: only the gain counts)

[objective.weights]                # value of one unit of each yield (placeholders)
food = 2.0                         # cities must grow to get their districts
production = 2.0                   # food, production and science first, for now
gold = 0.5
science = 2.0
culture = 0.5
faith = 0.5

[timing]
# When things are built. periods = 0: the static model (everything placed at once, each
# yield counted once). periods > 0: a horizon of periods x turns_per_period turns; each
# city and district gets the period it is founded/built in, counts from the next period
# on, and the objective is the yield summed over the horizon (per-turn yields x turns).
# Speeds are in turns (placeholders), converted to periods.
periods = 0
mode = "sequential"                # "sequential": the static model decides where, then the timed
                                   # model decides when with those placements fixed (fast);
                                   # "joint": where and when together (slow beyond small maps)
turns_per_period = 20
settlers_base = 1.0                # new cities per period, plus one per turns_per_settler per city
turns_per_settler = 40.0           # turns a city needs to train a settler
turns_per_district = 20.0          # turns a city needs to build a district
turns_per_specialty = 30.0         # city age (turns) for each specialty district after the first
ring_delay_turns = [0, 0, 15, 35]  # by distance from the city (0..3): turns before the tile is usable
district_base_value = 4.0          # weighted yield per turn of a built district, for its buildings
                                   # (adjacency alone is often below the covered tile's yields)
build_speedup = []                 # per period, multiplies the settler and district rates (empty: 1)

[solver]
# Passed to HiGHS through scipy.optimize.milp(options=...). Also accepted:
# presolve = true, node_limit = 1000. (disp is always on: the log is captured.)
time_limit = 60.0                  # seconds
mip_rel_gap = 1e-6                 # stop when within this relative gap of optimal
